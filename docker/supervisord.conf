[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 -F
autostart=true
autorestart=true
priority=15

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
autostart=true
autorestart=true
priority=20

[program:vsftpd]
command=bash -c "if [ -f /usr/local/sbin/vsftpd ]; then /usr/local/sbin/vsftpd; else /usr/sbin/vsftpd; fi"
autostart=true
autorestart=true
priority=30